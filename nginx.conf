worker_processes auto;
events { worker_connections 1024; }
http {
  upstream backend { server server:8000; }
  client_max_body_size 20m;

  server {
    listen 80;
    server_name api.jjikovoca.site;
    location / { return 301 https://$host$request_uri; }
  }

  server {
    listen 443 ssl;
    server_name api.jjikovoca.site;
    ssl_certificate     /etc/letsencrypt/live/api.jjikovoca.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.jjikovoca.site/privkey.pem;

    location / {
      proxy_pass http://backend;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_buffering off;          # SSE(분석 진행 스트림) 안전
      proxy_read_timeout 300s;
    }
  }
}